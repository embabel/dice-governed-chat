name: Verify
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install Chromium
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
      - run: ./scripts/verify
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: governed-chat-screens
          path: web/test-results/**/governed-*.png
          if-no-files-found: ignore
      - name: Export README captures
        run: |
          sudo apt-get install -y webp
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          import tempfile

          captures = {
              "governed-ask-desktop.png": "support-chat-desktop.webp",
              "governed-source-evidence-desktop.png": "source-evidence-desktop.webp",
              "governed-pending-review-desktop.png": "pending-review-desktop.webp",
              "governed-reviewed-history-mobile.png": "reviewed-history-mobile.webp",
          }
          for source, target in captures.items():
              image, = pathlib.Path("web/test-results").rglob(source)
              with tempfile.TemporaryDirectory() as temp:
                  output = pathlib.Path(temp) / target
                  subprocess.run(["cwebp", "-quiet", "-q", "82", str(image), "-o", str(output)], check=True)
                  data = base64.b64encode(output.read_bytes()).decode()
              for index in range(0, len(data), 12000):
                  print(f"GOVERNED_CAPTURE {target} {index // 12000} {data[index:index + 12000]}")
          PY
